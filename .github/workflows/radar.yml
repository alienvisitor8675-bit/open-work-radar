name: Refresh opportunities

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-opportunities
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run collector tests
        run: |
          python -m unittest discover -s tests -v
          python -m py_compile \
            scripts/__init__.py \
            scripts/fetch_github.py \
            scripts/fetch_github_core.py \
            scripts/fetch_opire.py \
            scripts/fetch_all.py \
            tests/test_fetch_github.py \
            tests/test_issue14.py \
            tests/test_issue17.py \
            tests/test_issue18.py

      - name: Collect opportunities
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/fetch_all.py \
            --status-output "${RUNNER_TEMP}/open-work-radar-refresh.json"

      - name: Publish refresh status in run summary
        if: always()
        run: |
          if [ -f "${RUNNER_TEMP}/open-work-radar-refresh.json" ]; then
            echo '## Refresh status' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat "${RUNNER_TEMP}/open-work-radar-refresh.json" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload refresh status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refresh-status-${{ github.run_id }}
          path: ${{ runner.temp }}/open-work-radar-refresh.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Commit generated data when materially changed
        run: |
          if git diff --quiet -- data/opportunities.json; then
            echo "No material generated data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/opportunities.json
          git commit -m "chore: refresh opportunities"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
